[project]
name = "nonebot-plugin-pErithacus"
version = "0.1.0"
description = "nonebot-plugin-pErithacus"
readme = "README.md"
requires-python = ">=3.9, <4.0"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["nonebot_plugin_localstore", "nonebot_plugin_alconna", "nonebot_plugin_orm", "nonebot_plugin_apscheduler"]
plugin_dirs = ["src/plugins"]
builtin_plugins = []
